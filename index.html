<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-card">
    <h1>Tic Tac Toe</h1>
    <p class="subtitle">Classic two-player game</p>

    <div id="status" class="status">Player X's turn</div>

    <div class="board" id="board" aria-label="Tic Tac Toe board"></div>

    <button type="button" onclick="restartGame()">Restart Game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
